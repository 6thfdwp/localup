# wt config template. Two places this can live:
#
#   <repo>/.wt.conf                 normal case — repo knowledge, next to the repo
#   ~/.config/wt/<repo-name>.conf   machine-specific overrides, sourced second
#
# To set up a repo without the file ever appearing in `git status`:
#
#   cp ~/.config/wt/example.conf <repo>/.wt.conf
#   echo '.wt.conf' >> <repo>/.git/info/exclude
#
# info/exclude is a local-only ignore list — it does the job of .gitignore
# without modifying a file the rest of the team shares.

# Branch new worktrees off this.
WT_BASE="origin/main"

# Gitignored files a fresh worktree can't inherit but needs to run.
# Anything in .gitignore that the app reads at startup belongs here.
WT_COPY=(
  .env
  .claude/settings.local.json
)

# Dependency install, run once inside the new worktree.
#   node:   WT_SETUP="npm ci"
#   python: WT_SETUP="uv sync"
#   go:     WT_SETUP="go mod download"
WT_SETUP=""

# Optional. Runs after the copy, before setup, with $WT_PATH (new worktree),
# $SLUG (task name), and $MAIN_REPO set. Use it to stop parallel worktrees
# fighting over shared local resources — ports, databases, caches.
#
# Helpers available: env_set <file> <KEY> <value>
#                    stable_num <string> <lo> <hi>   (deterministic per slug)
#
# wt_configure() {
#   local envf="$WT_PATH/.env"
#   [[ -f "$envf" ]] || return 0
#   env_set "$envf" PORT "$(stable_num "$SLUG" 8100 8199)"
