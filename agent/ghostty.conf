# Ghostty — tuned for the tmux worktree workflow (wt / wt-rm).
# Philosophy: Ghostty is a fast, dumb window. tmux does all the multiplexing.
# Anything Ghostty does that tmux also does is a second, conflicting layer.

# --- REQUIRED for the tmux keybindings -------------------------------------
# ~/.tmux.conf binds M-h / M-l (window nav) and M-arrows (pane nav). On macOS,
# Option is consumed for special characters unless this is set, so without it
# none of those bindings fire. This is the one non-optional line here.
macos-option-as-alt = true

# --- give tmux the whole window --------------------------------------------
# tmux draws its own status bar with the task list; a native titlebar on top
# is redundant. Set to "transparent" if you want the traffic-light buttons back.
macos-titlebar-style = hidden

window-padding-x = 6
window-padding-y = 2

# tmux keeps its own 50k-line history per pane and Ghostty's buffer is mostly
# invisible underneath it. No need to also hold 10M lines per surface.
scrollback-limit = 1000000

# --- don't grow a second multiplexer ---------------------------------------
# Deliberately not configuring Ghostty tabs/splits. Use tmux windows (`wt`,
# prefix+Space) so your task list survives closing the window. If you ever do
# open a Ghostty split, it inherits the worktree cwd, which is what you want.
split-inherit-working-directory = true
window-inherit-working-directory = true

# --- appearance (change freely, none of this is load-bearing) ---------------
font-size = 13
theme = dark:Builtin Tango Dark,light:Builtin Tango Light
