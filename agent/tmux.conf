# tmux config — window-per-task agent workflow.
# One window per worktree/task, named after the task. Left pane agent,
# right pane shell for tests and git. The status bar is your task list.

# --- basics -----------------------------------------------------------------
set -g default-terminal "tmux-256color"
# Ghostty advertises TERM=xterm-ghostty; without this override tmux falls back
# to 256 colours and truecolor output (diffs, agent syntax highlighting) is wrong.
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window names come from `wt`; don't let running commands overwrite them.
set -g allow-rename off
setw -g automatic-rename off

# --- prefix -----------------------------------------------------------------
# C-b stays the prefix. C-a is a common alternative — uncomment to swap.
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display "reloaded"

# prefix+m toggles mouse mode. With mouse on, tmux captures selection and the
# terminal's own copy/paste stops behaving normally — toggle it off to select
# text the native way (needed in Warp, which has no tmux integration).
bind m set -g mouse \; display "mouse #{?mouse,on,off}"

# --- panes ------------------------------------------------------------------
# Split in the current directory rather than wherever the session started.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- switching between tasks ------------------------------------------------
# prefix+Space: fuzzy-jump to any window in any session. The one binding that
# makes 5-10 parallel tasks navigable.
bind Space run-shell -b "tmux display-popup -E -w 60% -h 40% \
  'tmux list-windows -a -F \"#{session_name}:#{window_index} #{window_name}\" \
   | fzf --reverse --prompt=\"task> \" \
   | cut -d\" \" -f1 | xargs -r tmux switch-client -t'"

bind -n M-h previous-window
bind -n M-l next-window
bind Tab last-window

# --- copy mode --------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- status bar -------------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour240]%H:%M "

# Current task highlighted; a window with activity gets a dot.
setw -g window-status-format         " #I #W "
setw -g window-status-current-format "#[fg=colour16,bg=colour39,bold] #I #W #[default]"
setw -g window-status-activity-style "fg=colour214"
setw -g monitor-activity on
set -g visual-activity off

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
